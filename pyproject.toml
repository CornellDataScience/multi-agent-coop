[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infocoop"
version = "0.1.0"
description = "Simulate and analyze announcement and take behavior in a common-pool game"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["ollama>=0.3"]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
infocoop = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
