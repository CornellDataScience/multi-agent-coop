[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infocoop"
version = "0.1.0"
description = "Fisherman's Dilemma: do LLM agents lie when broadcasting private takes?"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["ollama>=0.3"]
dev = ["pytest>=7"]

[project.scripts]
infocoop = "infocoop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
