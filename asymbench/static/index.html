<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asymmetry Bench</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/leaderboard">Asymmetry Bench</a>
      <nav aria-label="Main">
        <a href="#/leaderboard" data-nav="leaderboard">Leaderboard</a>
        <a href="#/runs" data-nav="runs">Runs</a>
        <a href="#/new" data-nav="new">New Run</a>
        <a href="#/models" data-nav="models">Models</a>
        <a href="#/about" data-nav="about">About</a>
      </nav>
      <div class="topbar-right">
        <span class="key-dots" id="key-dots" title="Provider keys">
          <span class="dot" id="dot-anthropic" title="Anthropic key">A</span>
          <span class="dot" id="dot-openrouter" title="OpenRouter key">O</span>
          <span class="dot ok" id="dot-mock" title="Mock models (always available)">M</span>
        </span>
        <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark theme"
                aria-label="Toggle theme">◐</button>
      </div>
    </div>
  </header>
  <div id="error-banner" class="error-banner" hidden>
    <span id="error-text"></span>
    <button id="error-dismiss" aria-label="Dismiss">×</button>
  </div>
  <main id="app" class="content"></main>
  <div id="modal-root"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
