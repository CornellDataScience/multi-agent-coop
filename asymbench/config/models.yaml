# Model registry: the ONLY place model details live. Prices are USD per million tokens.
# Adding a model = one line here, or typing its id on the New Run page / in a run config.
# Unknown ids are routed by prefix: claude-* -> anthropic, mock/* -> mock, anything with "/" -> openrouter.
models:
  - {id: claude-fable-5-1, provider: anthropic, label: "Claude Fable 5.1", tier: S, price_in: 10.0, price_out: 50.0, max_tokens: 4000}
  - {id: claude-opus-5-5, provider: anthropic, label: "Claude Opus 5.5", tier: S, price_in: 4.0, price_out: 20.0, max_tokens: 4000}
  - {id: claude-sonnet-5-5, provider: anthropic, label: "Claude Sonnet 5.5", tier: S, price_in: 2.0, price_out: 10.0, max_tokens: 4000}
  # Sonnet 5.5's safety classifier refuses this benchmark's call pattern (see
  # DECISIONS.md #38); Sonnet 5 is the working default test agent.
  - {id: claude-sonnet-5, provider: anthropic, label: "Claude Sonnet 5", tier: S, price_in: 2.0, price_out: 10.0, max_tokens: 4000}
  # OpenRouter prices verified against /models on 2026-11-08 (runs use the
  # provider-reported cost per call anyway; these only feed estimates).
  - {id: meta-llama/llama-3.2-3b-instruct, provider: openrouter, label: "Llama 3.2 3B", tier: C0, price_in: 0.05, price_out: 0.33, max_tokens: 1500}
  - {id: meta-llama/llama-3.1-8b-instruct, provider: openrouter, label: "Llama 3.1 8B", tier: C1, price_in: 0.02, price_out: 0.04, max_tokens: 1500}
  - {id: openai/gpt-oss-20b, provider: openrouter, label: "gpt-oss-20b", tier: C2, price_in: 0.03, price_out: 0.13, max_tokens: 1500}
  - {id: claude-haiku-5-5, provider: anthropic, label: "Claude Haiku 5.5", tier: C3, price_in: 0.10, price_out: 0.50, max_tokens: 4000}
  - {id: mock/strong, provider: mock, label: "Mock strong", tier: mock, price_in: 0, price_out: 0}
  - {id: mock/weak, provider: mock, label: "Mock weak", tier: mock, price_in: 0, price_out: 0}
defaults:
  test_model: claude-sonnet-5  # was claude-sonnet-5-5; see DECISIONS.md #38
  counterparts: [meta-llama/llama-3.1-8b-instruct, openai/gpt-oss-20b]
  judge_model: claude-haiku-5-5
  seeds: 10
  budget_usd: 25
